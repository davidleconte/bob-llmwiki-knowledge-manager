# Gate configuration for check_savings_claims.py and check_status_consistency.py
# (ATK-GATE-07: externalize thresholds from gate scripts so a PR that weakens a
# threshold is conspicuous even to reviewers unfamiliar with the script internals.)
#
# OWNERSHIP: see .github/CODEOWNERS — this file requires a separate review token.
# Any change to thresholds here must be reviewed independently of any change to
# the claim or measurement it guards.

savings_gate:
  # Directory path fragments excluded from scanning (frozen dated records).
  excluded_dir_parts:
    - "knowledge-base/research"
  # Number of lines at the head of a file to check for a retraction/banner marker.
  banner_scan_lines: 20
  # Tolerance in percentage points for manifest value cross-check.
  # If a cited manifest exists and its mean_savings differs from the stated
  # percentage by more than this, the claim is considered unbacked.
  magnitude_tolerance_pct: 5.0

metric_gate:
  # C2: retrieval/accuracy metric overclaims (precision, p@N, nDCG, MRR, uplift) are
  # invisible to the savings gate (no savings keyword). A metric keyword + percentage
  # on a live surface must cite a report (evaluation/results/retrieval-*/report.json)
  # or be retracted. Deliberately scoped to named retrieval metrics — bare English
  # "accuracy"/"recall" are OUT of scope to avoid false positives. Reuses the savings
  # gate's surface list and banner/frozen logic (C1).
  metric_keywords:
    - "p@"
    - "recall@"
    - "ndcg"
    - "mrr"
    - "map@"
    - "precision"
    - "uplift"

status_gate:
  # Live documents whose undated claims must agree with the single homes.
  # If any file in this list is missing (renamed/deleted), the gate fails closed.
  live_docs:
    - STATUS.md
    - README.md
    - AGENTS.md
    - tests/README.md
    - docs/project-management/project-status.md
  # The canonical maturity string that STATUS.md must assert.
  canonical_status_string: "Not Production Ready"

coverage_gate:
  # Must match [tool.coverage.report] fail_under in pyproject.toml.
  # The gate script reads pyproject.toml directly; this entry documents the
  # expected value and triggers a review whenever it changes here.
  fail_under: 80
