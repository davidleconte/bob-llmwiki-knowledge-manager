[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bob-llmwiki-knowledge-manager"
version = "1.0.0"
description = "Bob Shell Knowledge Manager - LLM-Wiki pattern implementation for IBM Bob Shell"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "David Leconte"}
]
keywords = ["bob-shell", "knowledge-management", "llm-wiki", "token-optimization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "tiktoken>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "pytest-timeout>=2.1.0",
    "pytest-benchmark>=4.0.0",
    "hypothesis>=6.100.0",
    "PyYAML>=6.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "bandit>=1.7",
]
monitoring = [
    "psutil>=5.9.0",
]
# Apple Neural Engine MiniLM backend — macOS + Apple Silicon only.
# Safe to omit: EmbeddingGenerator silently falls back to "hashing" when absent.
mlx = [
    "mlx-embeddings>=0.1",
]

[project.scripts]
# Unified CLI over the TokenOptimizer facade (src/cli.py). Also runnable as
# `python -m src` via src/__main__.py.
bob-optimize = "src.cli:main"

[project.urls]
Homepage = "https://github.com/davidleconte/bob-llmwiki-knowledge-manager"
Documentation = "https://github.com/davidleconte/bob-llmwiki-knowledge-manager/tree/main/docs"
Repository = "https://github.com/davidleconte/bob-llmwiki-knowledge-manager"
Issues = "https://github.com/davidleconte/bob-llmwiki-knowledge-manager/issues"
Security = "https://github.com/davidleconte/bob-llmwiki-knowledge-manager/security/policy"

[tool.setuptools]
packages = ["src"]

[tool.setuptools.package-dir]
"" = "."

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Coverage is intentionally NOT in default addopts: plain `pytest` stays fast and
# subset runs (e.g. `pytest tests/truncation`) don't trip the fail_under gate.
# Coverage + gate are enforced via an explicit `pytest --cov=src` run (CI + the
# documented full check); the threshold lives once in [tool.coverage.report].
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "unit: marks tests as fast, isolated unit tests",
    "integration: marks tests as integration tests",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "e2e: marks tests as end-to-end tests",
]
# Per-test wall-clock ceiling: a hung test (e.g. a lock deadlock or a leaked
# background thread) FAILS with a full thread dump instead of stalling the whole
# suite / CI forever. Generous enough for the benchmark tests (~seconds each).
timeout = 60

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
    # src/tools/ is now IN the gated denominator (Phase 8). It was excluded while
    # its handlers were shallowly tested, but src/tools holds the untrusted-path
    # handlers (kb_query / batch_file_reader / component_analyzer) reached via each
    # tool's CLI and the delegation task.target -- the most security-relevant code
    # to leave unmeasured. Behavioral tests (tests/tools/) brought it to ~94%, and
    # scripts/check_coverage_by_package.py pins a per-package floor so it can't rot.
]

[tool.coverage.report]
# Single home for the coverage gate. Any `pytest --cov=src` run (CI + the
# documented full check) fails if total coverage drops below this floor.
# History: 49.4% pre-Phase-1 → 72% at the Phase 2 config consolidation → 74.5%
# after the Phase 2 triage → 82.5% after Phase 2 hardening (property tests +
# cost_tracker/cost_reporting driven 34%/11% → 100%, plus the RLock deadlock fix).
# Floor ratcheted 73 → 80 (the plan's target) with ~2.5pt margin for
# optional-dependency skip variance (matplotlib/psutil). Per-package floors live
# in scripts/check_coverage_by_package.py (their single home — not restated here,
# so the numbers can't drift).
fail_under = 80
precision = 1
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.bandit]
# SAST config. CI runs `bandit -r src/ -ll` (medium+ severity) as a blocking
# lint step. That threshold is clean today. The remaining low-severity hits are
# known-benign and deliberately below the gate: the hardened static-argv `git`
# subprocess in src/validation/manifest.py (B404/B603/B607 — list argv, no
# shell=True), non-crypto `random` in the measurement harness (B311), and
# defensive try/except/continue in the file-scan tools (B112). None is a real
# vulnerability; see docs/security/THREAT_MODEL.md. Any *new* medium+ finding
# must be fixed or carry a scoped `# nosec BXXX` with a justification — never a
# blanket disable. exclude_dirs applies to full-repo runs (`bandit -c pyproject.toml -r .`).
exclude_dirs = [".venv", "tests", "build", "dist"]

[tool.ruff]
# Single home for lint + format config. CI runs `ruff check` and
# `ruff format --check`; both read from here.
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Conservative, near-fully-autofixable baseline (pyflakes + pycodestyle + isort).
# The formatter owns line length, so E501 is disabled here. Stricter families
# (B, UP, SIM, ...) can be ratcheted in later once this baseline is green.
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately bind intermediate values for readability/asserts elsewhere,
# bootstrap sys.path before importing, and import optional deps to probe them.
"tests/**" = ["F841"]
"tests/conftest.py" = ["E402"]
"tests/monitoring/test_health.py" = ["F401"]
# These e2e tests embed prompt fixtures whose trailing/blank-line whitespace is
# intentional string content; the formatter preserves it, so silence the linter.
"tests/e2e/test_real_llm.py" = ["W291", "W293"]
"tests/e2e/test_cost_tracking.py" = ["W291", "W293"]

[tool.mypy]
# First type-gate: non-strict baseline, ratchet toward strict later. Runs once on
# 3.12 in CI (the numpy stubs use 3.12 syntax, so an older --python-version can't
# parse them); the supported *runtime* floor is still 3.11.
python_version = "3.12"
files = ["src"]
# Excluded from the type gate:
# - src/delegation: the orphaned, experimental subsystem (see
#   scripts/check_coverage_by_package.py). Per the Phase-4 decision it stays a
#   separate, layering-clean subsystem (not facade-wired), so it is not typed now.
# - src/tools: operational CLI utilities relocated out of scripts/ in Phase 4 to
#   kill the src->scripts layering violation; tooling, not runtime library, and
#   untyped while under scripts/ — excluding preserves that status quo.
exclude = "^src/(delegation|tools)/"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
