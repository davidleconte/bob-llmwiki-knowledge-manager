[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bob-llmwiki-knowledge-manager"
version = "1.0.0"
description = "Bob Shell Knowledge Manager - LLM-Wiki pattern implementation for IBM Bob Shell"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "David Leconte"}
]
keywords = ["bob-shell", "knowledge-management", "llm-wiki", "token-optimization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "tiktoken>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "pytest-timeout>=2.1.0",
    "pytest-benchmark>=4.0.0",
    "hypothesis>=6.100.0",
    "PyYAML>=6.0",
]
monitoring = [
    "psutil>=5.9.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/bob-llmwiki-knowledge-manager"
Documentation = "https://github.com/yourusername/bob-llmwiki-knowledge-manager/tree/main/docs"
Repository = "https://github.com/yourusername/bob-llmwiki-knowledge-manager"
Issues = "https://github.com/yourusername/bob-llmwiki-knowledge-manager/issues"

[tool.setuptools]
packages = ["src"]

[tool.setuptools.package-dir]
"" = "."

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Coverage is intentionally NOT in default addopts: plain `pytest` stays fast and
# subset runs (e.g. `pytest tests/truncation`) don't trip the fail_under gate.
# Coverage + gate are enforced via an explicit `pytest --cov=src` run (CI + the
# documented full check); the threshold lives once in [tool.coverage.report].
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]
markers = [
    "unit: marks tests as fast, isolated unit tests",
    "integration: marks tests as integration tests",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "e2e: marks tests as end-to-end tests",
]
# Per-test wall-clock ceiling: a hung test (e.g. a lock deadlock or a leaked
# background thread) FAILS with a full thread dump instead of stalling the whole
# suite / CI forever. Generous enough for the benchmark tests (~seconds each).
timeout = 60

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
# Single home for the coverage gate. Any `pytest --cov=src` run (CI + the
# documented full check) fails if total coverage drops below this floor.
# History: 49.4% pre-Phase-1 → 72% at the Phase 2 config consolidation → 74.5%
# after the Phase 2 triage → 82.5% after Phase 2 hardening (property tests +
# cost_tracker/cost_reporting driven 34%/11% → 100%, plus the RLock deadlock fix).
# Floor ratcheted 73 → 80 (the plan's target) with ~2.5pt margin for
# optional-dependency skip variance (matplotlib/psutil). Per-package floors
# (monitoring ≥70, delegation ≥54 staged) live in scripts/check_coverage_by_package.py.
fail_under = 80
precision = 1
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
