name: CI

# CI: tests + coverage gate on the supported Python matrix (3.11, 3.12), enforced
# lint (ruff) and type (mypy) gates, the flag-gated e2e suite, the Phase-5
# manifest-backed validation harness (null + manifest + tiktoken gates), benchmark
# regression trending, a CycloneDX SBOM + dependency audit, and a load/soak job
# (informational on CI — asserting on local developer hardware). The coverage gate,
# per-package floors, and the status "one home per value" validator run in `test`;
# the layering gate, the manifest-backed-savings guard, the generic
# "one home per value" value-homes validator, the API-doc freshness check, and the
# Phase-7 security gates (community-health completeness + bandit SAST at medium+)
# run in `lint`. Dependabot (.github/dependabot.yml) keeps deps + actions patched.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Single-version jobs (e2e, benchmarks, lint, typecheck, sbom) pin this; the
  # `test` job runs the full supported matrix. Kept in sync with pyproject
  # requires-python (>=3.11) and classifiers (3.11, 3.12).
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: tests + coverage gate (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (locked from uv.lock — test matrix)
        # uv sync --frozen installs the exact versions pinned in uv.lock, making
        # builds reproducible. The uv.lock is verified in-sync by the sbom job
        # (uv lock --check). All subsequent steps use `uv run` so they execute
        # inside the managed venv rather than against the system Python.
        # Replaces the floating ">=" pip install (supply-chain fix).
        run: uv sync --frozen --extra dev --extra monitoring
      - name: Pre-warm tiktoken cache
        # encoding_for_model downloads the BPE vocab on a cold cache; the
        # TokenCounter constructor only catches (ImportError, KeyError), not a
        # network error — so warm it once to keep the tests hermetic.
        run: uv run python -c "import tiktoken; tiktoken.encoding_for_model('gpt-4')"
      - name: Run tests with coverage gate
        # --cov enforces fail_under from [tool.coverage.report]; plain pytest does not.
        # Exclude tests/load and tests/performance from this required gate: their
        # soak and p99 wall-clock tests hang or flake it (PR #25 stalled ~62 min
        # here on a suite that runs in ~1 min), and they already have dedicated
        # jobs — `load + soak (informational)` and `benchmarks (perf regression)`.
        # They exercise already-covered src, so the coverage floors still hold
        # (89% total, all per-package floors green). Do NOT use `-m "not slow"`:
        # slow-marked tests also live in tests/cache/concurrency/delegation and
        # DO contribute coverage — only the two dirs above are the hang source.
        run: uv run pytest --cov=src --ignore=tests/load --ignore=tests/performance --cov-report=json:coverage.json --cov-report=term-missing
      - name: Enforce per-package coverage floors
        run: uv run python scripts/check_coverage_by_package.py coverage.json
      - name: Enforce status/coverage "one home per value" consistency
        # Fails if a live status doc cites a coverage gate that disagrees with
        # pyproject fail_under, or reintroduces a retracted maturity claim.
        run: uv run python scripts/check_status_consistency.py
      - name: Scale-regression + DoS-hardening gate (A8 / ATK-DOS)
        # Both suites live in tests/performance/ (excluded from the coverage run
        # above) and use manual timing, so the benchmarks job's --benchmark-only
        # deselects them — i.e. they run in NO other job. Run them here as a
        # dedicated gate so a re-introduced quadratic in PageRank (A1),
        # build_semantic (A2), the cold rebuild (A3ii) or L2 eviction (A4) fails the
        # PR before it reaches main. Ratio ceilings: config/gates/gate-config.yaml.
        #
        # test_dos_hardening.py (ATK-DOS-01/05/06) was previously in this same
        # "runs in NO other job" hole but was never added to this step, so its 9
        # regression tests guarded nothing. Named explicitly rather than running the
        # whole directory: test_prod_confidence.py has known p99 wall-clock flakes
        # on shared runners, and test_{cache,optimizer}_performance.py are
        # benchmark-driven and belong to the benchmarks job.
        run: |
          uv run pytest \
            tests/performance/test_scale_invariants.py \
            tests/performance/test_dos_hardening.py \
            -q

  kb-integrity:
    name: KB cross-reference integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate KB cross-references
        # Fails the build if any non-research Markdown link in docs/knowledge-base/
        # resolves to a missing file. Research snapshots emit warnings only.
        #
        # NOTE: this covers docs/knowledge-base/ ONLY (KB_DIR in the script) — roughly
        # 4% of the repo's Markdown. Tree-wide link integrity is the separate
        # link-integrity job below; do not mistake this job's green for that.
        run: bash scripts/validate-kb.sh

  link-integrity:
    name: Markdown link integrity (tree-wide, case-sensitive)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prove the detector can fail
        # A gate that cannot fail proves nothing: plant known-bad and known-good links
        # and require the expected verdict for each before trusting the scan below.
        run: python scripts/check_md_links.py --selftest
      - name: Resolve every relative Markdown link against the git index
        # Audit 2026-07-25, finding class 1: a partial UPPER_SNAKE -> kebab-case rename
        # left ~103 broken references live, invisible because (a) the only link checker
        # was scoped to docs/knowledge-base/ and (b) macOS core.ignorecase resolves
        # wrong-case paths that GitHub and this Linux runner 404. The gate resolves
        # against `git ls-files`, never the filesystem — checking the filesystem would
        # reproduce the exact blindness it exists to remove.
        run: python scripts/check_md_links.py
      - name: Prove the doc-freshness date parser is correct
        # This self-test earned its place immediately: the first pattern could not read
        # STATUS.md's own `| **As of** | date |` row, so the live scan passed by silently
        # skipping the very file the gate exists for. A green scan proved nothing until
        # the parser was pinned.
        run: python scripts/check_doc_freshness.py --selftest
      - name: Documents asserting currency must be current
        # Audit 2026-07-25 (V-6): STATUS.md — "the canonical maturity status", which every
        # other doc defers to — read "As of 2026-07-19" through 18 merged PRs. Staleness
        # has no syntax; only the commit log can catch it.
        run: python scripts/check_doc_freshness.py
      - name: Prove the architecture-freshness detector can fail
        run: python scripts/check_architecture_freshness.py --selftest
      - name: Pin the hand-written architecture layer to src/
        # Audit 2026-07-25, finding A-11: docs/api/ was in perfect sync (55/55 modules)
        # while ARCHITECTURE.md — "the single authoritative architecture document" —
        # described none of six modules added after its last update, two of them security
        # controls (provenance signing, the A7 input-bound caps). The difference between
        # the two layers was not care: one had a freshness gate and the other did not.
        # This applies the same pin to the layer that actually drifts.
        run: python scripts/check_architecture_freshness.py

  gate-integrity:
    name: gate integrity (ATK-GATE-07)
    runs-on: ubuntu-latest
    # Only meaningful on a PR (needs the base...HEAD diff). Structural substitute
    # for a second gate reviewer — see SECURITY.md §Gate Independence.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Forbid weakening a gate + planting a claim in one PR
        # Fails a PR whose diff touches BOTH a gate definition
        # (config/gates/**, scripts/check_*.py, src/validation/**) and a claim
        # surface (STATUS.md, README.md, docs/** except generated docs/api/**).
        run: |
          git fetch -q origin "${{ github.base_ref }}"
          python scripts/check_gate_integrity.py --base "origin/${{ github.base_ref }}"

  lint:
    name: lint + format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install ruff
        # PINNED (2026-07-25). `ruff>=0.6.0` was a floating lower bound, so this job
        # silently upgraded on every run. When 0.16.0 added Python-block formatting
        # *inside Markdown*, three files that had passed for months began failing —
        # on `main`, with nobody having changed a line. A lint job whose result depends
        # on the day it ran is not a gate; it is a coin flip that occasionally blocks
        # merges. Bump this deliberately, and reformat in the same commit.
        run: pip install "ruff==0.16.0"
      - name: Ruff lint (config in pyproject [tool.ruff.lint])
        run: ruff check src tests scripts
      - name: Ruff format check
        run: ruff format --check src tests scripts
      - name: Enforce src -> scripts layering (no upward imports, B3)
        # AST-based gate: fails if any src/ module imports from scripts/.
        run: python scripts/check_layering.py
      - name: Enforce manifest-backed savings claims (no un-provenanced numbers)
        # Fails if a live surface publishes a savings/cost/hit-rate percentage
        # without citing a reproducible manifest (STATUS.md publishing rule).
        run: python scripts/check_savings_claims.py
      - name: Enforce report-backed retrieval/accuracy metrics (C2)
        # Sibling of the savings gate: a retrieval-precision / p@N overclaim carries
        # no savings keyword, so this gate requires a report citation or retraction.
        run: python scripts/check_metric_claims.py
      - name: Enforce "one home per value" (no cross-file value drift)
        # Generic value-homes guard: a value duplicated across files (version,
        # python floor, model pricing) must match its single canonical home.
        run: python scripts/check_value_homes.py
      - name: Enforce API-doc freshness (generated == source docstrings)
        # AST-based generator (stdlib only); fails if docs/api/ drifts from the
        # src/ docstrings. Regenerate with `python scripts/generate_api_docs.py`.
        run: python scripts/generate_api_docs.py --check
      - name: Enforce community-health set present (governance completeness)
        # Curated gate (stdlib only): fails if a required governance file
        # (SECURITY.md, CONTRIBUTING, CODE_OF_CONDUCT, GOVERNANCE, SUPPORT,
        # CODEOWNERS, THREAT_MODEL, issue/PR templates) is missing or a stub.
        run: python scripts/check_community_health.py
      - name: Doc href-casing lint (Linux CI ground truth)
        # Fails if any active .md file contains a Markdown href using the
        # pre-rename uppercase filename variants that silently resolve on macOS
        # HFS+ but break on this Linux runner.  Matches only href syntax
        # (](...)) to avoid false-positives from prose, code blocks, or repo
        # scan reports that discuss the old names.
        # Exclusions: project-management plans, deprecated/, archive/, adr/
        # (historic prose), and knowledge-base/research/ (mnemox lesson notes
        # that discuss the renames as prose, not as live hrefs).
        # Pattern rationale (mnemox lessons 2026-07-18 Finding 1) — each entry is
        # the WRONG spelling, verified against `git ls-files` (the Linux ground
        # truth), not against the case-insensitive local filesystem:
        #   ](QUICK_START.md)   → on-disk name is quick-start.md
        #   ](sla.md)           → on-disk name is SLA.md
        #   ](architecture.md)  → on-disk name is ARCHITECTURE.md
        #
        # The SLA rule was INVERTED before 2026-07-25: it forbade `](SLA.md)` — the
        # correct spelling — while permitting the broken `](sla.md)`, so the gate was
        # driving docs toward the 404. `git ls-files | grep -i 'sla\.md'` returns
        # exactly `docs/SLA.md`. This rule remains a 3-pattern stopgap; the general
        # replacement is scripts/check_md_links.py (resolves every href against the
        # git index, case-sensitively).
        run: |
          bad=$(grep -rn \
            --include="*.md" \
            -e "](QUICK_START\.md)" \
            -e "](sla\.md)" \
            -e "](architecture\.md)" \
            README.md STATUS.md CHANGELOG.md docs/ \
            --exclude-dir=".git" \
            --exclude-dir="project-management" \
            --exclude-dir="planning" \
            --exclude-dir="plans" \
            --exclude-dir="deprecated" \
            --exclude-dir="archive" \
            --exclude-dir="adr" \
            --exclude-dir="research" \
            2>/dev/null || true)
          if [ -n "$bad" ]; then
            echo "❌ Href casing violations found (break on Linux, silent on macOS):"
            echo "$bad"
            exit 1
          fi
          echo "✅ No href casing violations."
      - name: Install bandit (SAST)
        run: pip install "bandit>=1.7"
      - name: Bandit security scan (src/, medium+ severity)
        # SAST gate at medium+ severity (config + benign-low-finding rationale in
        # pyproject [tool.bandit]); clean today. A new medium+ finding blocks CI.
        run: bandit -r src/ -ll

  typecheck:
    name: typecheck (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install (locked from uv.lock — typecheck)
        # mypy + the runtime deps it needs to resolve types are in the dev extra.
        run: uv sync --frozen --extra dev --extra monitoring
      - name: Run mypy (config + scope in pyproject [tool.mypy])
        run: uv run mypy

  e2e:
    name: e2e (RUN_E2E_TESTS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install (locked from uv.lock — e2e)
        run: uv sync --frozen --extra dev --extra monitoring
      - name: Pre-warm tiktoken cache
        run: uv run python -c "import tiktoken; tiktoken.encoding_for_model('gpt-4')"
      - name: Run end-to-end suite behind the flag
        # These e2e tests use tiktoken for real token counting; they do NOT call a
        # live LLM API, so no secrets are required.
        env:
          RUN_E2E_TESTS: "1"
        run: uv run pytest tests/e2e/ -v

  validation:
    name: validation (manifest-backed savings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install (locked from uv.lock — validation)
        run: uv sync --frozen --extra dev --extra monitoring
      - name: Pre-warm tiktoken cache
        run: uv run python -c "import tiktoken; tiktoken.encoding_for_model('gpt-4')"
      - name: Run manifest-backed validation harness
        # The exit code encodes the honest gates: the null test passes (optimizer
        # savings on shuffled input < threshold), the manifest is complete, and
        # tiktoken counting is active. It deliberately does NOT gate on savings
        # MAGNITUDE -- gating a measurement would re-incentivise fabrication.
        run: uv run python -m src.validation --corpus repo --out "$RUNNER_TEMP/validation"
      - name: Upload validation report + manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: ${{ runner.temp }}/validation
          if-no-files-found: ignore

  benchmarks:
    name: benchmarks (perf regression)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install (locked from uv.lock — benchmarks)
        run: uv sync --frozen --extra dev --extra monitoring
      - name: Pre-warm tiktoken cache
        run: uv run python -c "import tiktoken; tiktoken.encoding_for_model('gpt-4')"
      - name: Restore benchmark baseline
        uses: actions/cache@v4
        with:
          path: .benchmarks
          key: benchmarks-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            benchmarks-${{ runner.os }}-
      - name: Run benchmarks (autosave)
        # Always autosave the current run so every PR contributes a fresh baseline
        # snapshot. The guarded regression compare (step below) only runs on main,
        # where the hardware is the same run-to-run and the gate is meaningful.
        # This prevents spurious PR failures from GitHub Actions shared-VM noise
        # (observed 2–5× variance on ubuntu-latest 2-vCPU) while preserving a
        # real regression gate for merges to main.
        run: uv run pytest tests/performance/ --benchmark-only --benchmark-autosave

      - name: Compare benchmarks (fail on regression, main only)
        # Enforce the 50% median regression gate only on main. On PRs the autosave
        # step above builds the baseline; this step is skipped so noisy VM variance
        # cannot block a PR that has no genuine performance regression.
        if: github.ref == 'refs/heads/main'
        run: |
          if ls .benchmarks/*/*.json >/dev/null 2>&1; then
            uv run pytest tests/performance/ --benchmark-only \
              --benchmark-compare --benchmark-compare-fail=median:50%
          else
            echo "No benchmark baseline yet — skipping compare."
          fi

  load:
    name: load + soak (informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install (locked from uv.lock — load)
        run: uv sync --frozen --extra dev --extra monitoring
      - name: Pre-warm tiktoken cache
        run: uv run python -c "import tiktoken; tiktoken.encoding_for_model('gpt-4')"
      - name: Run load tests (informational — non-asserting on CI)
        # LOAD_TEST_ASSERT defaults to 0 on CI (CI env var is set). Metrics are
        # collected and printed; latency assertions are NOT blocking so shared-vCPU
        # noise cannot fail the build. The 60-second soak is excluded from CI.
        # Run locally with LOAD_TEST_ASSERT=1 to enforce SLA targets from docs/SLA.md.
        run: uv run pytest tests/load/ -v -s -m "not slow" --tb=short

  sbom:
    name: SBOM + dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install project + SBOM/audit tools (incl. uv for lock ops)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,monitoring]"
          pip install cyclonedx-bom pip-audit uv
      - name: Verify uv.lock is in sync with pyproject (reproducible closure)
        run: uv lock --check
      - name: Generate CycloneDX SBOM (installed environment)
        run: cyclonedx-py environment -o sbom.cdx.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
      - name: Export the locked dependency closure
        # Audit the deterministic uv.lock closure, not the '>=' floors the jobs
        # install on -- so the CVE gate is reproducible and lock-pinned (Phase 8,
        # closing the "CI never installs from uv.lock" supply-chain residual).
        run: uv export --frozen --no-emit-project --format requirements-txt --output-file requirements.lock.txt
      - name: Dependency vulnerability audit (BLOCKING, against the locked closure)
        # Was continue-on-error in Phase 3; the locked closure is clean (0 CVEs),
        # so this is now a blocking gate that fails the build on any new CVE.
        # --strict: also fails if pip-audit itself encounters an error (e.g. network
        # unavailable, missing metadata) so a broken audit cannot silently pass.
        run: pip-audit --requirement requirements.lock.txt --strict
      - name: Audit evaluation tooling dependencies (informational)
        # evaluation/requirements.lock.txt covers the ad-hoc analysis-only deps
        # (pandas, scipy, matplotlib, seaborn). Not installed by the package or CI
        # test jobs; audited here for visibility. continue-on-error because these
        # deps are not on the critical path — a CVE in matplotlib does not block
        # the project release, but we want to see it.
        continue-on-error: true
        run: pip-audit --requirement evaluation/requirements.lock.txt

  adversarial-regression:
    name: Adversarial regression tests
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install (locked from uv.lock)
        run: uv sync --frozen --extra dev --extra monitoring
      - name: Pre-warm tiktoken cache
        run: uv run python -c "import tiktoken; tiktoken.encoding_for_model('gpt-4')"
      - name: Run adversarial regression tests
        # planted_defect tests are excluded from CI — they document exploits and are
        # run manually (red on unfixed tree, green on fixed tree) to close findings.
        run: uv run pytest tests/security/ tests/gates/ tests/retrieval/ -v --tb=short -m "not planted_defect"

  supply-chain-hygiene:
    name: Supply-chain hygiene (secrets scan + gate independence)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Scan for committed credentials (ATK-SUP-09)
        # Grep tracked files for PASSWORD= followed by a non-empty, non-placeholder value.
        # Placeholder patterns ("PASSWORD=", "PASSWORD=<...>", PASSWORD="your-password")
        # are intentional in .env.template and config example files and are excluded.
        # The regex matches PASSWORD= with a real-looking value (alphanumeric, 3+ chars).
        run: |
          HITS=$(git ls-files | xargs grep -Pn 'PASSWORD=[A-Za-z0-9!@#$%^&*]{3,}' 2>/dev/null \
            | grep -v ".example" | grep -v ".gitignore" | grep -v "knowledge-base/research" \
            | grep -v "\.env\.template" | grep -v "credential-template" || true)
          if [ -n "$HITS" ]; then
            echo "ERROR: potential committed credential found in tracked files:"
            echo "$HITS"
            exit 1
          fi
          echo "OK: no real PASSWORD= credentials found in tracked files"
      - name: Verify gate config exists (ATK-GATE-07)
        run: |
          test -f config/gates/gate-config.yaml || \
            (echo "ERROR: config/gates/gate-config.yaml missing" && exit 1)
          echo "OK: gate-config.yaml present"

