name: CI

# Phase-3 CI: tests + coverage gate on the supported Python matrix (3.11, 3.12),
# enforced lint (ruff) and type (mypy) gates, the flag-gated e2e suite, benchmark
# regression trending, and a CycloneDX SBOM + dependency audit. The coverage gate,
# per-package floors, and the status "one home per value" validator run in `test`.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Single-version jobs (e2e, benchmarks, lint, typecheck, sbom) pin this; the
  # `test` job runs the full supported matrix. Kept in sync with pyproject
  # requires-python (>=3.11) and classifiers (3.11, 3.12).
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: tests + coverage gate (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (editable + dev/monitoring extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,monitoring]"
      - name: Pre-warm tiktoken cache
        # encoding_for_model downloads the BPE vocab on a cold cache; the
        # TokenCounter constructor only catches (ImportError, KeyError), not a
        # network error — so warm it once to keep the tests hermetic.
        run: python -c "import tiktoken; tiktoken.encoding_for_model('gpt-4')"
      - name: Run tests with coverage gate
        # --cov enforces fail_under from [tool.coverage.report]; plain pytest does not.
        run: pytest --cov=src --cov-report=json:coverage.json --cov-report=term-missing
      - name: Enforce per-package coverage floors
        run: python scripts/check_coverage_by_package.py coverage.json
      - name: Enforce status/coverage "one home per value" consistency
        # Fails if a live status doc cites a coverage gate that disagrees with
        # pyproject fail_under, or reintroduces a retracted maturity claim.
        run: python scripts/check_status_consistency.py

  lint:
    name: lint + format (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install ruff
        run: pip install "ruff>=0.6.0"
      - name: Ruff lint (config in pyproject [tool.ruff.lint])
        run: ruff check src tests scripts
      - name: Ruff format check
        run: ruff format --check src tests scripts

  typecheck:
    name: typecheck (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install (editable + dev/monitoring extras)
        # mypy + the runtime deps it needs to resolve types are in the dev extra.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,monitoring]"
      - name: Run mypy (config + scope in pyproject [tool.mypy])
        run: mypy

  e2e:
    name: e2e (RUN_E2E_TESTS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install (editable + dev/monitoring extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,monitoring]"
      - name: Pre-warm tiktoken cache
        run: python -c "import tiktoken; tiktoken.encoding_for_model('gpt-4')"
      - name: Run end-to-end suite behind the flag
        # These e2e tests use tiktoken for real token counting; they do NOT call a
        # live LLM API, so no secrets are required.
        env:
          RUN_E2E_TESTS: "1"
        run: pytest tests/e2e/ -v

  benchmarks:
    name: benchmarks (perf regression)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install (editable + dev/monitoring extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,monitoring]"
      - name: Pre-warm tiktoken cache
        run: python -c "import tiktoken; tiktoken.encoding_for_model('gpt-4')"
      - name: Restore benchmark baseline
        uses: actions/cache@v4
        with:
          path: .benchmarks
          key: benchmarks-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            benchmarks-${{ runner.os }}-
      - name: Run benchmarks (autosave + guarded regression compare)
        # First run has no baseline — just snapshot. Later runs fail if the median
        # regresses >25% vs the most recent saved run (generous; CI runners are
        # noisy). Phase 3 can tighten this once a stable baseline exists.
        run: |
          if ls .benchmarks/*/*.json >/dev/null 2>&1; then
            pytest tests/performance/ --benchmark-only --benchmark-autosave \
              --benchmark-compare --benchmark-compare-fail=median:25%
          else
            echo "No benchmark baseline yet — establishing first snapshot."
            pytest tests/performance/ --benchmark-only --benchmark-autosave
          fi

  sbom:
    name: SBOM + dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install project + SBOM/audit tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,monitoring]"
          pip install cyclonedx-bom pip-audit
      - name: Generate CycloneDX SBOM (installed environment)
        run: cyclonedx-py environment -o sbom.cdx.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
      - name: Dependency vulnerability audit (non-blocking during Phase 3)
        # Report-only for now; flip to blocking once the environment is clean.
        continue-on-error: true
        run: pip-audit
