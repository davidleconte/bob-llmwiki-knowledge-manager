# Dependabot keeps dependencies and CI actions patched. Complements the
# supply-chain tooling in ci.yml (CycloneDX SBOM + pip-audit): Dependabot opens
# the update PRs, the SBOM/audit report on what is installed. See SECURITY.md.
version: 2
updates:
  # Python dependencies declared in pyproject.toml.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"

  # GitHub Actions pinned in .github/workflows/.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "ci"
    commit-message:
      prefix: "ci"
